services:
  neo4j:
    image: neo4j:5.26-community
    container_name: orizia-neo4j
    ports:
      - "7474:7474"   # interface web
      - "7687:7687"   # connexion de l'application (Bolt)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
